# GitHub Actions Workflow created for handling the release process based on the  release prepared with.
# Running the publishPlugin task requires all following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intel/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v1
        with:
          ref: ${{ github.event.release }}

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          distribution: zulu
          java-version: 17

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v1

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          ${{ github.event.release.body }}
          
          echo "$GITHUB_OUTPUT
          echo "$GITHUB_OUTPUT
          echo "GITHUB_OUTPUT

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: .gradlew publishPlugin

      # Upload artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} .build/distributions
        
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: |
      "${{ github.event.release }}"
          BRANCH="update-release"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout $MASTERBRANCH
          git commit "Changelog update"
          git push --set origin $MASTERBRANCH
          
          gh label create "$MASTERBRANCH" \
            --description "Pull requests with release update"
            --title "Changelog update
            --body "Current pull request contains file for the update
            --label "$MASTERBRANCH \
            --head $MASTERBRANCH



            
